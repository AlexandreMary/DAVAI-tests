[project]
name = "davai_taskutil"
dynamic = ["version"]
description = "Davai utilities for Davai/Vortex tasks."
readme = "README.md"
requires-python = ">=3.10"
keywords = []
license = {text = "CECILL-C"}
authors = [
    { name = "Alexandre Mary"  , email = "alexandre.mary@meteo.fr"}
    ]
dependencies=[
    #"davai_env==1.2.0",
    "ial_build==1.3.2",
    "ial_expertise==1.2.0",
    "bronx",
    # indirect dependencies
    "epygram==2.0.2",
    "requests[socks]",
    ]

[project.urls]
source = "https://github.com/ACCORD-NWP/DAVAI-tests.git"
tracker = "https://github.com/ACCORD-NWP/DAVAI-tests/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
davai_taskutil = "src/davai_taskutil"

#[tool.setuptools.package-data]
#"davai_taskutil" = ["conf/*.ini"]

[tool.setuptools.dynamic]
version = {attr = "davai_taskutil.__version__"}

